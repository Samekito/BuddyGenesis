# Runs the test suite and a dependency vulnerability audit on every push and pull request.
# Free: GitHub Actions is free for public repos and within the free monthly minutes for private ones.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest
      - name: Audit dependencies for known vulnerabilities
        run: python -m pip_audit --requirement requirements.txt
