<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Buddy — Create account</title>
<meta name="description" content="Create a SOC Buddy account.">
<link rel="icon" href="/favicon">
<link rel="stylesheet" href="/public/auth.css">
<script src="/public/auth.js"></script>
</head>
<body>
<div class="page">
  <div class="form-side">
    <div class="brand"><img id="logo" alt="SOC Buddy" src="/logo?theme=dark"></div>
    <div class="center">
      <form id="signup-form" novalidate>
        <h1>Create your account</h1>
        <p class="error" id="error" role="alert" hidden></p>
        <p class="notice" role="status" hidden></p>
        <div class="fields">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" autocomplete="name" placeholder="Ada Lovelace" maxlength="80" required>
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="me@example.com" maxlength="254" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
              <button class="reveal" type="button" aria-label="Show password" data-for="password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <p class="hint">At least 8 characters, not a common password or your name.</p>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <div class="input-wrap">
              <input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128" required>
              <button class="reveal" type="button" aria-label="Show password" data-for="confirm">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button class="primary" id="submit" type="submit">Sign Up</button>
          <div id="google-section" class="fields" hidden>
            <div class="divider"><span>OR</span></div>
            <button class="outline" id="google" type="button">
              <svg height="24" viewBox="0 0 24 24" width="24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Continue with Google
            </button>
          </div>
        </div>
        <p class="switch">Already have an account? <a href="/login">Sign in</a></p>
      </form>
    </div>
  </div>
  <div class="art"><img src="/favicon" alt=""></div>
</div>
<a class="privacy" href="/public/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>
<script>
  const form = document.getElementById("signup-form");
  const submit = document.getElementById("submit");
  showThemedLogo();
  enablePasswordReveal();

  // Already signed in: nothing to sign up for.
  fetch("/user", { credentials: "include" }).then((r) => { if (r.ok) location.replace("/"); });

  fetch("/auth/config")
    .then((r) => r.json())
    .then((config) => {
      if ((config.oauthProviders || []).includes("google")) document.getElementById("google-section").hidden = false;
    })
    .catch(() => {});
  document.getElementById("google").addEventListener("click", () => location.assign("/auth/oauth/google"));

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    hideError();
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const password = form.password.value;
    if (!name || !email || !password) return showError("Please fill in every field.");
    if (password !== form.confirm.value) return showError("The two passwords do not match.");
    whileBusy(submit, "Creating account…", async () => {
      // The reply is the same whether or not the email already has an account; the email says which.
      const { ok, detail } = await postJson("/auth/signup", { name, email, password });
      if (!ok) throw new Error(detail);
      showNotice(form, detail);
    });
  });
</script>
</body>
</html>
