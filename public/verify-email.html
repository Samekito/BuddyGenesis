<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The address holds a confirmation token until the script removes it; never pass it on as a referrer. -->
<meta name="referrer" content="no-referrer">
<title>SOC Buddy — Confirm your email</title>
<link rel="icon" href="/favicon">
<link rel="stylesheet" href="/public/auth.css">
<script src="/public/auth.js"></script>
</head>
<body>
<div class="page">
  <div class="form-side">
    <div class="brand"><img id="logo" alt="SOC Buddy" src="/logo?theme=dark"></div>
    <div class="center">
      <!-- A form, not an automatic request: mail scanners open links and must not create accounts. The
           password proves the click comes from whoever chose it, not from a stranger who typed this address. -->
      <form id="verify-form" novalidate>
        <h1>Confirm your email</h1>
        <p class="error" id="error" role="alert" hidden></p>
        <p class="notice" role="status" hidden></p>
        <div class="fields">
          <p class="intro">Enter the password you chose when signing up to finish creating your account.</p>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
              <button class="reveal" type="button" aria-label="Show password" data-for="password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button class="primary" id="submit" type="submit">Confirm my email</button>
        </div>
        <p class="switch"><a href="/login">Go to sign in</a></p>
      </form>
    </div>
  </div>
  <div class="art"><img src="/favicon" alt=""></div>
</div>
<a class="privacy" href="/public/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>
<script>
  const form = document.getElementById("verify-form");
  const submit = document.getElementById("submit");
  const token = takeTokenFromLink();
  showThemedLogo();
  enablePasswordReveal();
  if (!token) showError("This link is incomplete. Open the link from your email again.");

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    hideError();
    const password = form.password.value;
    if (!password) return showError("Please enter the password you chose when signing up.");
    whileBusy(submit, "Confirming…", async () => {
      const { ok, detail } = await postJson("/auth/verify-email", { token, password });
      if (!ok) throw new Error(detail);
      showNotice(form, detail);
    });
  });
</script>
</body>
</html>
