<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The address holds a reset token until the script removes it; never pass it on as a referrer. -->
<meta name="referrer" content="no-referrer">
<title>SOC Buddy — Choose a new password</title>
<link rel="icon" href="/favicon">
<link rel="stylesheet" href="/public/auth.css">
<script src="/public/auth.js"></script>
</head>
<body>
<div class="page">
  <div class="form-side">
    <div class="brand"><img id="logo" alt="SOC Buddy" src="/logo?theme=dark"></div>
    <div class="center">
      <form id="reset-form" novalidate>
        <h1>Choose a new password</h1>
        <p class="error" id="error" role="alert" hidden></p>
        <p class="notice" role="status" hidden></p>
        <div class="fields">
          <div class="field">
            <label for="password">New password</label>
            <div class="input-wrap">
              <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
              <button class="reveal" type="button" aria-label="Show password" data-for="password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <p class="hint">At least 8 characters, not a common password or your name.</p>
          </div>
          <div class="field">
            <label for="confirm">Confirm new password</label>
            <div class="input-wrap">
              <input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128" required>
              <button class="reveal" type="button" aria-label="Show password" data-for="confirm">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button class="primary" id="submit" type="submit">Change password</button>
        </div>
        <p class="switch"><a href="/login">Back to sign in</a></p>
      </form>
    </div>
  </div>
  <div class="art"><img src="/favicon" alt=""></div>
</div>
<a class="privacy" href="/public/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>
<script>
  const form = document.getElementById("reset-form");
  const submit = document.getElementById("submit");
  const token = takeTokenFromLink();
  showThemedLogo();
  enablePasswordReveal();
  if (!token) showError("This link is incomplete. Open the link from your email again, or ask for a new one.");

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    hideError();
    const password = form.password.value;
    if (!password) return showError("Please enter a new password.");
    if (password !== form.confirm.value) return showError("The two passwords do not match.");
    whileBusy(submit, "Changing…", async () => {
      const { ok, detail } = await postJson("/auth/password-reset/confirm", { token, password });
      if (!ok) throw new Error(detail);
      showNotice(form, detail);
    });
  });
</script>
</body>
</html>
