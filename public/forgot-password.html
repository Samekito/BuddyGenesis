<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Buddy — Forgot password</title>
<meta name="description" content="Reset your SOC Buddy password.">
<link rel="icon" href="/favicon">
<link rel="stylesheet" href="/public/auth.css">
<script src="/public/auth.js"></script>
</head>
<body>
<div class="page">
  <div class="form-side">
    <div class="brand"><img id="logo" alt="SOC Buddy" src="/logo?theme=dark"></div>
    <div class="center">
      <form id="forgot-form" novalidate>
        <h1>Forgot your password?</h1>
        <p class="intro">Enter your account's email and we will send you a link to choose a new password.</p>
        <p class="error" id="error" role="alert" hidden></p>
        <p class="notice" role="status" hidden></p>
        <div class="fields">
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="me@example.com" maxlength="254" required>
          </div>
          <button class="primary" id="submit" type="submit">Send reset link</button>
        </div>
        <p class="switch">Remembered it? <a href="/login">Sign in</a></p>
      </form>
    </div>
  </div>
  <div class="art"><img src="/favicon" alt=""></div>
</div>
<a class="privacy" href="/public/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>
<script>
  const form = document.getElementById("forgot-form");
  const submit = document.getElementById("submit");
  showThemedLogo();

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    hideError();
    const email = form.email.value.trim();
    if (!email) return showError("Please enter your email address.");
    whileBusy(submit, "Sending…", async () => {
      // The reply is the same whether or not the email has an account.
      const { ok, detail } = await postJson("/auth/password-reset", { email });
      if (!ok) throw new Error(detail);
      showNotice(form, detail);
    });
  });
</script>
</body>
</html>
